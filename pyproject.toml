[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "MyMovieGraphQL"
version = "1.1.0"
description = "Python3.10+ to fetch data from IMDb via the GraphQL API"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
authors = [
  { name = "MiM-MiM", email = "69122723+MiM-MiM@users.noreply.github.com" },
]
maintainers = [
  { name = "MiM-MiM", email = "69122723+MiM-MiM@users.noreply.github.com" },
]
keywords = ["IMDb", "IMDbGraphQL", "GraphQL", "IMDbAPI", "API"]
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
]
dependencies = [
  "beartype",
  "langcodes",
  "requests",
  "orjson",
]

[project.urls]
Homepage = "https://github.com/MiM-MiM/MyMovieGraphQLPy"
Source = "https://github.com/MiM-MiM/MyMovieGraphQLPy"
Tracker = "https://github.com/MiM-MiM/MyMovieGraphQLPy/issues"
Documentation = "https://github.com/MiM-MiM/MyMovieGraphQLPy/wiki"

[project.optional-dependencies]
dev = [
  "responses",
  "ruff",
  "pytest",
  "sphinx",
  "sphinx-rtd-theme",
  "sphinx-autodoc-typehints",
]

[tool.setuptools]
include-package-data = true
packages = ["MyMovieGraphQL"]

[tool.setuptools.package-data]
"MyMovieGraphQL" = ["data/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 127
target-version = "py310"
include = [
  "MyMovieGraphQL/**/*.py",
  "tests/**/*.py",
]
exclude = [
  "build",
  "docs",
  ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.black]
line-length = 127
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.venv
  | build
  | dist
  | docs
)/
'''
